<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - PulseFit Gym & Classes</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
    <link href="assets/css/auth.css" rel="stylesheet">
    <link href="assets/css/premium.css" rel="stylesheet">
</head>

<body class="auth-body">
    <!-- Floating Accessibility Controls -->
    <div class="auth-controls">
        <button class="btn btn-outline-secondary btn-sm" id="rtlToggleBtn">RTL</button>
        <button class="theme-toggle btn btn-link text-decoration-none ms-3" id="themeToggle">
            <i class="bi bi-sun fs-5"></i>
        </button>
    </div>

    <!-- Signup Section -->
    <section class="auth-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-7 col-xl-5">
                    <div class="premium-auth-card">
                        <div class="auth-header-visual">
                            <a class="d-flex align-items-center justify-content-center text-decoration-none mb-4"
                                href="index.html">
                                <div class="brand-logo">
                                    <i class="bi bi-heart-pulse-fill text-primary fs-2"></i>
                                </div>
                                <span class="brand-name ms-2 fw-bold fs-3 text-dark dark-text-white">PulseFit</span>
                            </a>
                            <h2 class="auth-title">Get Started</h2>
                            <p class="text-muted">Join the high-energy PulseFit gym community.</p>
                        </div>

                        <div class="auth-form-wrap">
                            <form id="signupForm">
                                <div class="form-floating-custom">
                                    <i class="bi bi-person form-icon"></i>
                                    <input type="text" class="form-control" id="fullName" placeholder=" " required>
                                    <label>Full Name</label>
                                </div>

                                <div class="form-floating-custom">
                                    <i class="bi bi-envelope form-icon"></i>
                                    <input type="email" class="form-control" id="email" placeholder=" " required>
                                    <label>Email Address</label>
                                </div>

                                <div class="form-floating-custom mb-3">
                                    <i class="bi bi-shield-lock form-icon"></i>
                                    <input type="password" class="form-control" id="password" placeholder=" " required>
                                    <label>Create Password</label>
                                    <button
                                        class="btn btn-link position-absolute top-50 end-0 translate-middle-y text-muted me-2"
                                        type="button" id="togglePassword">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>

                                <div class="mb-4">
                                    <div class="progress mb-2" style="height: 4px;">
                                        <div id="passwordStrength" class="progress-bar bg-danger" role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                                    </div>
                                    <div class="d-flex justify-content-between">
                                        <span class="small text-muted password-strength-label">Password Strength:</span>
                                        <span class="small text-muted password-strength-text fw-bold">Too Short</span>
                                    </div>
                                </div>

                                <div class="form-floating-custom mb-3">
                                    <i class="bi bi-shield-lock-fill form-icon"></i>
                                    <input type="password" class="form-control" id="confirmPassword" placeholder=" " required>
                                    <label>Confirm Password</label>
                                    <button
                                        class="btn btn-link position-absolute top-50 end-0 translate-middle-y text-muted me-2"
                                        type="button" id="toggleConfirmPassword">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>

                                <div class="form-check custom-check mb-4">
                                    <input class="form-check-input" type="checkbox" id="terms" required>
                                    <label class="form-check-label small fw-600 cursor-pointer" for="terms">
                                        I agree to the <a href="#" class="text-primary text-decoration-none">Privacy & Terms</a>
                                    </label>
                                </div>

                                <button type="submit"
                                    class="btn btn-primary w-100 btn-lg rounded-pill py-3 fw-bold shadow-lg mb-4">
                                    Create My Account <i class="bi bi-chevron-right ms-1"></i>
                                </button>
                            </form>

                            <div class="d-flex align-items-center gap-3 mb-4">
                                <hr class="flex-grow-1 opacity-10">
                                <span class="small text-muted fw-bold">OR JOIN WITH</span>
                                <hr class="flex-grow-1 opacity-10">
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-4">
                                    <button class="social-btn-premium w-100 px-1" style="font-size: 0.85rem;" title="Google">
                                        <img src="https://www.google.com/favicon.ico" width="16" alt="Google"> <span class="d-none d-sm-inline ms-1">Google</span>
                                    </button>
                                </div>
                                <div class="col-4">
                                    <button class="social-btn-premium w-100 px-1" style="font-size: 0.85rem;" title="Apple">
                                        <i class="bi bi-apple fs-6"></i> <span class="d-none d-sm-inline ms-1">Apple</span>
                                    </button>
                                </div>
                                <div class="col-4">
                                    <button class="social-btn-premium w-100 px-1" style="font-size: 0.85rem;" title="LinkedIn">
                                        <i class="bi bi-linkedin text-primary fs-6"></i> <span class="d-none d-sm-inline ms-1">LinkedIn</span>
                                    </button>
                                </div>
                            </div>

                            <div class="text-center">
                                <p class="text-muted small mb-0">Already have an account? <a href="login.html"
                                        class="text-primary fw-bold text-decoration-none">Sign In</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/premium.js"></script>
    <script>
        // Password visibility toggle
        document.getElementById('togglePassword').addEventListener('click', function () {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                passwordInput.type = 'password';
                icon.className = 'bi bi-eye';
            }
        });

        // Confirm Password visibility toggle
        document.getElementById('toggleConfirmPassword').addEventListener('click', function () {
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const icon = this.querySelector('i');

            if (confirmPasswordInput.type === 'password') {
                confirmPasswordInput.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                confirmPasswordInput.type = 'password';
                icon.className = 'bi bi-eye';
            }
        });

        // Password strength checker
        document.getElementById('password').addEventListener('input', function () {
            const password = this.value;
            const strengthBar = document.getElementById('passwordStrength');
            const strengthText = document.querySelector('.password-strength-text');

            let strength = 0;
            let strengthLabel = 'Too Short';
            let strengthClass = 'bg-danger';

            if (password.length >= 8) strength += 20;
            if (password.match(/[a-z]/)) strength += 20;
            if (password.match(/[A-Z]/)) strength += 20;
            if (password.match(/[0-9]/)) strength += 20;
            if (password.match(/[^a-zA-Z0-9]/)) strength += 20;

            if (password.length < 6) {
                strengthLabel = 'Too Short';
                strengthClass = 'bg-danger';
            } else if (strength <= 40) {
                strengthLabel = 'Weak';
                strengthClass = 'bg-danger';
            } else if (strength <= 60) {
                strengthLabel = 'Fair';
                strengthClass = 'bg-warning';
            } else if (strength <= 80) {
                strengthLabel = 'Good';
                strengthClass = 'bg-info';
            } else {
                strengthLabel = 'Strong';
                strengthClass = 'bg-success';
            }

            strengthBar.style.width = strength + '%';
            strengthBar.className = `progress-bar ${strengthClass}`;
            strengthText.textContent = strengthLabel;
        });

        // Form validation
        document.getElementById('signupForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password.length < 6) {
                Utils.showNotification('Password must be at least 6 characters long!', 'error');
                return;
            }

            if (password !== confirmPassword) {
                Utils.showNotification('Passwords do not match!', 'error');
                return;
            }

            // Simulate account creation
            Utils.showNotification('Account created successfully! Redirecting...', 'success');

            // Redirect to dashboard after delay
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1500);
        });
    </script>
</body>

</html>
