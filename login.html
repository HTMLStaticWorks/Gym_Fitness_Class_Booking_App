<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PulseFit Gym & Classes</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
    <link href="assets/css/auth.css" rel="stylesheet">
    <link href="assets/css/premium.css" rel="stylesheet">
</head>

<body class="auth-body">
    <!-- Floating Accessibility Controls -->
    <div class="auth-controls">
        <button class="btn btn-outline-secondary btn-sm" id="rtlToggleBtn">RTL</button>
        <button class="theme-toggle btn btn-link text-decoration-none ms-3" id="themeToggle">
            <i class="bi bi-sun fs-5"></i>
        </button>
    </div>

    <!-- Login Section -->
    <section class="auth-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-5">
                    <div class="premium-auth-card">
                        <div class="auth-header-visual">
                            <a class="d-flex align-items-center justify-content-center text-decoration-none mb-4"
                                href="index.html">
                                <div class="brand-logo">
                                    <i class="bi bi-heart-pulse-fill text-primary fs-2"></i>
                                </div>
                                <span class="brand-name ms-2 fw-bold fs-3 text-dark dark-text-white">PulseFit</span>
                            </a>
                            <h2 class="auth-title">Welcome Back</h2>
                            <p class="text-muted">Access your member portal and schedules.</p>
                        </div>

                        <div class="auth-form-wrap">
                            <form id="loginForm">
                                <div class="form-floating-custom">
                                    <i class="bi bi-envelope form-icon"></i>
                                    <input type="email" class="form-control" id="email" placeholder=" " required>
                                    <label>Email Address</label>
                                </div>

                                <div class="form-floating-custom mb-3">
                                    <i class="bi bi-shield-lock form-icon"></i>
                                    <input type="password" class="form-control" id="password" placeholder=" " required>
                                    <label>Password</label>
                                    <button
                                        class="btn btn-link position-absolute top-50 end-0 translate-middle-y text-muted me-2"
                                        type="button" id="togglePassword">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>

                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <div class="form-check custom-check mb-0">
                                        <input class="form-check-input flex-shrink-0" type="checkbox" id="remember">
                                        <label class="form-check-label fw-600 cursor-pointer text-nowrap" for="remember" style="font-size: 0.7rem;">Keep me logged in</label>
                                    </div>
                                    <a href="#" class="text-primary fw-bold text-decoration-none text-nowrap" style="font-size: 0.7rem;">Reset Password?</a>
                                </div>

                                <button type="submit"
                                    class="btn btn-primary w-100 btn-lg rounded-pill py-3 fw-bold shadow-lg mb-4">
                                    Sign In to Portal <i class="bi bi-arrow-right-short fs-4"></i>
                                </button>
                            </form>

                            <div class="d-flex align-items-center gap-3 mb-4">
                                <hr class="flex-grow-1 opacity-10">
                                <span class="small text-muted fw-bold">OR QUICK CONNECT</span>
                                <hr class="flex-grow-1 opacity-10">
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-4">
                                    <button class="social-btn-premium w-100 px-1" style="font-size: 0.85rem;" title="Google">
                                        <img src="https://www.google.com/favicon.ico" width="16" alt="Google"> <span class="d-none d-sm-inline ms-1">Google</span>
                                    </button>
                                </div>
                                <div class="col-4">
                                    <button class="social-btn-premium w-100 px-1" style="font-size: 0.85rem;" title="Apple">
                                        <i class="bi bi-apple fs-6"></i> <span class="d-none d-sm-inline ms-1">Apple</span>
                                    </button>
                                </div>
                                <div class="col-4">
                                    <button class="social-btn-premium w-100 px-1" style="font-size: 0.85rem;" title="LinkedIn">
                                        <i class="bi bi-linkedin text-primary fs-6"></i> <span class="d-none d-sm-inline ms-1">LinkedIn</span>
                                    </button>
                                </div>
                            </div>

                            <div class="text-center">
                                <p class="text-muted small mb-0">New to PulseFit? <a href="signup.html"
                                        class="text-primary fw-bold text-decoration-none">Create Member Account</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/premium.js"></script>
    <script>
        // Password visibility toggle
        document.getElementById('togglePassword').addEventListener('click', function () {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                passwordInput.type = 'password';
                icon.className = 'bi bi-eye';
            }
        });

        // Login form submission
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const remember = document.getElementById('remember').checked;

            // Simulate login
            Utils.showNotification('Login successful! Redirecting...', 'success');

            // Store login state
            if (remember) {
                localStorage.setItem('rememberUser', email);
            }

            // Redirect to dashboard after delay
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1000);
        });
    </script>
</body>

</html>
